name: Deploy to Cloudflare Workers

# Se déclenche à chaque push sur main : build de prod (npm run build,
# voir README.md) puis publication du contenu de dist/ sur le Worker
# Cloudflare existant (wandering-bird-a58b.bayet-thomas.workers.dev),
# via la fonctionnalité "Workers static assets". Ce workflow remplace
# le glisser-déposer manuel du zip, sans changer de Worker ni d'URL.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
