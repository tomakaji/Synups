name: Deploy to Cloudflare Pages

# Se déclenche à chaque push sur main : build de prod (npm run build,
# voir README.md) puis publication du contenu de dist/ sur le projet
# Cloudflare Pages existant (mode "Direct Upload" conservé — ce workflow
# remplace juste le glisser-déposer manuel du zip par un envoi via
# Wrangler, sans changer de projet ni d'URL).
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # ⚠️ Remplacer par le nom EXACT du projet Pages existant
          # (visible dans dash.cloudflare.com → Workers & Pages).
          command: pages deploy dist --project-name=REMPLACE_PAR_TON_PROJET
